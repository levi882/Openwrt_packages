[package]
name = "overlay-restore"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ipnet = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shlex = "2"
tar = { version = "0.4", default-features = false }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
overflow-checks = true
