name: build-feed

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-feed
  cancel-in-progress: false

env:
  CF_PAGES_PROJECT: openwrt-packages

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - openwrt_branch: openwrt-25.12
            openwrt_arch: x86_64
            feed_name: myfeed
    env:
      OPENWRT_BRANCH: ${{ matrix.target.openwrt_branch }}
      OPENWRT_ARCH: ${{ matrix.target.openwrt_arch }}
      FEED_NAME: ${{ matrix.target.feed_name }}

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: cache Rust toolchain and builds
        uses: actions/cache@v4
        with:
          path: .restore-rust-cache
          key: restore-rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'packages/overlay-restore/src/Cargo.lock') }}

      - name: verify recovery sources
        run: |
          bash scripts/test-restore-rust.sh
          node --check packages/luci-app-overlay-restore/htdocs/luci-static/resources/view/system/overlay-restore.js
          bash -n scripts/build-local-apks.sh scripts/setup-restore-rust.sh scripts/test-restore-rust.sh
          sh -n router/restore_overlay.sh packages/overlay-restore/files/etc/init.d/overlay-restore
          sh -n packages/luci-app-overlay-restore/root/usr/libexec/rpcd/overlay-restore

      - name: download release apks from manifest
        run: |
          python3 .github/scripts/download-release-apks.py \
            .github/release-apks.json \
            "bin/packages/${OPENWRT_ARCH}/${FEED_NAME}"

      - name: cache OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: .openwrt-sdk-cache
          key: openwrt-sdk-${{ env.OPENWRT_BRANCH }}-${{ env.OPENWRT_ARCH }}-rust-${{ hashFiles('rust-toolchain.toml', 'packages/overlay-restore/src/Cargo.lock') }}

      - name: build local recovery packages
        run: bash scripts/build-local-apks.sh "bin/packages/${OPENWRT_ARCH}/${FEED_NAME}"

      - name: reindex apk feed
        run: bash .github/scripts/reindex-apk-feed.sh "bin/packages/${OPENWRT_ARCH}/${FEED_NAME}"
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}

      - name: prepare feed artifact
        run: |
          mkdir -p "public/${OPENWRT_BRANCH}/${OPENWRT_ARCH}"
          cp -a "bin/packages/${OPENWRT_ARCH}/${FEED_NAME}" "public/${OPENWRT_BRANCH}/${OPENWRT_ARCH}/"
          find public -maxdepth 4 -type f | sort

      - name: upload feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: feed-${{ matrix.target.openwrt_branch }}-${{ matrix.target.openwrt_arch }}-${{ matrix.target.feed_name }}
          path: public
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: download feed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: feed-*
          path: public
          merge-multiple: true

      - name: prepare pages
        run: |
          test -s public-key.pem
          cp public-key.pem public/public-key.pem
          python3 .github/scripts/generate-index.py public "Levi's Feed"
          find public -maxdepth 4 -type f | sort

      - name: deploy to cloudflare pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.CF_PAGES_PROJECT }}
